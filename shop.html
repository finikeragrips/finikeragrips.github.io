<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap" />
  <link rel="stylesheet" href="/css/site.css" />
  <meta property="og:site_name" content="Finikera Grips" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://finikeragrips.github.io/assets/estuche-01.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Tienda de cachas — Colt 1911, Hi-Power, Beretta 92 | Finikera Grips</title>
  <meta name="description" content="Catálogo de cachas premium: perla, diamantadas, madera y chapa de oro para Colt 1911, Browning Hi-Power y Beretta 92. Filtra por modelo y color." />
  <link rel="canonical" href="https://finikeragrips.github.io/shop.html" />
  <meta property="og:title" content="Tienda — Finikera Grips" />
  <meta property="og:url" content="https://finikeragrips.github.io/shop.html" />
</head>
<body>
<main id="main">
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow">Tienda</p>
      <h1 class="h1">Cachas &amp; <em>estuches</em></h1>
      <p class="lead" style="margin:0">Piezas seleccionadas y revisadas una por una. Filtra por el modelo de tu pistola, el color o busca un motivo.</p>
    </div>
  </header>
  <div class="wrap shop-layout">
    <aside class="filters" id="filters" aria-label="Filtros">
      <div class="filters__close"><span class="h3" style="margin:0">Filtros</span><button class="icon-btn" id="filters-close" aria-label="Cerrar filtros">✕</button></div>
      <fieldset><legend>Tipo</legend><div id="f-type"></div></fieldset>
      <fieldset><legend>Modelo</legend><div id="f-model"></div></fieldset>
      <fieldset><legend>Color</legend><div id="f-color"></div></fieldset>
      <button class="btn btn--ghost btn--sm" id="f-reset" type="button">Limpiar filtros</button>
      <button class="btn btn--block filter-toggle" id="filters-apply" type="button">Ver resultados</button>
    </aside>
    <section aria-label="Productos">
      <div class="toolbar">
        <label class="search">
          <span class="sr-only">Buscar</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="q" placeholder="Buscar: perla, San Judas, diamantado…" autocomplete="off" />
        </label>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn btn--ghost btn--sm filter-toggle" id="filters-open" type="button">Filtros</button>
          <label class="sr-only" for="sort">Ordenar</label>
          <select class="select" id="sort">
            <option value="featured">Destacados</option>
            <option value="name">Nombre A–Z</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
          </select>
        </div>
      </div>
      <div class="chips" id="active-chips"></div>
      <p class="tiny" id="count" aria-live="polite"></p>
      <div class="product-grid" id="grid"></div>
    </section>
  </div>
  <div class="section--tight"></div>
</main>
<script type="module" src="/js/shop.js"></script>
</body>
</html>
